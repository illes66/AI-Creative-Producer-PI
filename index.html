<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mini Fishing Playable</title>
    <style>
      :root {
        --bg: #9ee7ff;
        --sea: #3db6e6;
        --sand: #f0d8a8;
        --ui: #0e3a56;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 20%, #d8f6ff 0, #b7edff 40%, #8fdaff 100%);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .frame {
        width: min(92vw, 960px);
        border: 6px solid #fff;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
        overflow: hidden;
        background: #fff;
      }
      canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        background: linear-gradient(var(--bg) 0 36%, var(--sea) 36% 88%, var(--sand) 88%);
        touch-action: none;
      }
      .legend {
        padding: 10px 14px;
        font-size: 14px;
        color: var(--ui);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <canvas id="game" width="960" height="540" aria-label="Juego de pesca"></canvas>
      <div class="legend">Move the hook ← → and ↑ ↓ (or mouse/touch). Catch the fish to know my skills.</div>
    </div>

    <script>
      // ===== CAMBIA AQUÍ LAS IMÁGENES (PNG) =====
      // Sustituye las rutas cuando tengas tus assets reales.
const ASSET_PATHS = {
  rod: "rod.png",
   hook: "hook.png",
  plants: "plants.png",
   fishes: ["fish1.png", "fish2.png"]

};

      // ===== AJUSTA AQUÍ ANIMACIONES Y DIFICULTAD =====
      const GAME_CONFIG = {
        fishCount: 12,
        fishSpeedMin: 45,
        fishSpeedMax: 110,
        goal: 12,
        sparkleLife: 0.5,
      };

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      const images = {};
      const fallbackFishColors = ["#ff7f6b", "#ffd36b", "#92f29f", "#d7a9ff"];

      function loadImage(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve({ ok: true, img });
          img.onerror = () => resolve({ ok: false, img: null });
          img.src = src;
        });
      }

    async function loadAssets() {
  const [rod, hook, plants, ...fishes] = await Promise.all([
    loadImage(ASSET_PATHS.rod),
    loadImage(ASSET_PATHS.hook),
    loadImage(ASSET_PATHS.plants),
    ...ASSET_PATHS.fishes.map(loadImage),
  ]);

  images.rod = rod.ok ? rod.img : null;
  images.hook = hook.ok ? hook.img : null;
  images.plants = plants.ok ? plants.img : null;
  images.fishes = fishes.filter((f) => f.ok).map((f) => f.img);
}

      const state = {
        fish: [],
        sparkles: [],
        hook: { x: 240, y: 160, radius: 18 },
        score: 0,
        message: "Catch my skills!",
        messageTimer: 2.5,
      };

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createFish() {
        const leftToRight = Math.random() > 0.5;
        const speed = rand(GAME_CONFIG.fishSpeedMin, GAME_CONFIG.fishSpeedMax);
        return {
          x: leftToRight ? rand(80, 260) : rand(700, 900),
          y: rand(220, 440),
          w: rand(100, 140),
          h: rand(50, 70),
          vx: leftToRight ? speed : -speed,
          spriteIndex: Math.floor(rand(0, Math.max(images.fishes.length, 1))),
        };
      }

      function resetFish() {
        state.fish = Array.from({ length: GAME_CONFIG.fishCount }, createFish);
      }

      function clampHook() {
        state.hook.x = Math.max(80, Math.min(canvas.width - 60, state.hook.x));
        state.hook.y = Math.max(110, Math.min(canvas.height - 40, state.hook.y));
      }

      function spawnSparkles(x, y) {
        for (let i = 0; i < 18; i++) {
          const a = (Math.PI * 2 * i) / 18;
          const speed = rand(30, 120);
          state.sparkles.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            life: GAME_CONFIG.sparkleLife,
          });
        }
      }

      function update(dt) {
        for (const f of state.fish) {
          f.x += f.vx * dt;
          if (f.x < 44 || f.x > canvas.width - 44) f.vx *= -1;

          const dx = f.x - state.hook.x;
          const dy = f.y - state.hook.y;
          if (Math.hypot(dx, dy) < state.hook.radius + f.h * 0.45) {
            state.score += 1;
            state.message = "Skill catched! ✨";
            state.messageTimer = 1;
            spawnSparkles(f.x, f.y);
          //  Object.assign(f, createFish());
        f.caught = true;

            if (state.score >= GAME_CONFIG.goal) {
              state.message = "¡You got your new member team!";
              state.messageTimer = 2;
              state.score = 0;
            }
          }
        }
        state.fish = state.fish.filter((f) => !f.caught);

        state.sparkles = state.sparkles.filter((p) => {
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.96;
          p.vy *= 0.96;
          return p.life > 0;
        });

        if (state.messageTimer > 0) state.messageTimer -= dt;
      }

   function drawFish(f) {
  const facingRight = f.vx >= 0;
  const sprite = images.fishes[f.spriteIndex % (images.fishes.length || 1)] || null;

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(facingRight ? 1 : -1, 1);

  const targetW = 100;
  const targetH = 100;

  if (sprite) {
    ctx.drawImage(sprite, -targetW / 2, -targetH / 2, targetW, targetH);
  } else {
    // fallback
  }

  ctx.restore();
}

      function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Plantas en primer plano
        if (images.plants) {
ctx.drawImage(images.plants, 0, canvas.height - 180, canvas.width, 180);        } else {
          ctx.fillStyle = "rgba(8,112,68,.45)";
          for (let x = 20; x < canvas.width; x += 68) {
            ctx.fillRect(x, canvas.height - 92 - ((x / 19) % 22), 8, 86);
          }
        }

        state.fish.forEach(drawFish);

        // Caña fija
        if (images.rod) {
          ctx.drawImage(images.rod, 40, 20, 260, 170);
        } else {
          ctx.strokeStyle = "#8b5e34";
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(70, 40);
          ctx.quadraticCurveTo(210, 30, 280, 150);
          ctx.stroke();
        }

        // Hilo + anzuelo movible
        ctx.strokeStyle = "#eaf5ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(280, 150);
        ctx.lineTo(state.hook.x, state.hook.y);
        ctx.stroke();

        if (images.hook) {
          ctx.drawImage(images.hook, state.hook.x - 18, state.hook.y - 18, 36, 36);
        } else {
          ctx.strokeStyle = "#d6eef9";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(state.hook.x, state.hook.y, 14, -0.4, Math.PI * 1.3);
          ctx.stroke();
        }

        for (const p of state.sparkles) {
          ctx.globalAlpha = Math.max(0, p.life / GAME_CONFIG.sparkleLife);
          ctx.fillStyle = "#fff7a8";
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#083450";
        ctx.font = "700 28px system-ui";
        ctx.fillText(`Peces: ${state.score}/${GAME_CONFIG.goal}`, 20, 40);

        if (state.messageTimer > 0) {
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "rgba(0, 0, 0, .26)";
          ctx.lineWidth = 4;
          ctx.font = "800 42px system-ui";
          const textW = ctx.measureText(state.message).width;
          const textX = (canvas.width - textW) * 0.5;
          const textY = 90;
          ctx.strokeText(state.message, textX, textY);
          ctx.fillText(state.message, textX, textY);
        }
      }

      const keyState = new Set();
      window.addEventListener("keydown", (e) => keyState.add(e.key));
      window.addEventListener("keyup", (e) => keyState.delete(e.key));

      function updateInput(dt) {
        const speed = 280;
        if (keyState.has("ArrowLeft") || keyState.has("a") || keyState.has("A")) state.hook.x -= speed * dt;
        if (keyState.has("ArrowRight") || keyState.has("d") || keyState.has("D")) state.hook.x += speed * dt;
        if (keyState.has("ArrowUp") || keyState.has("w") || keyState.has("W")) state.hook.y -= speed * dt;
        if (keyState.has("ArrowDown") || keyState.has("s") || keyState.has("S")) state.hook.y += speed * dt;
        clampHook();
      }

      function pointerToHook(evt) {
        const rect = canvas.getBoundingClientRect();
        const x = ((evt.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((evt.clientY - rect.top) / rect.height) * canvas.height;
        state.hook.x = x;
        state.hook.y = y;
        clampHook();
      }

      canvas.addEventListener("pointerdown", pointerToHook);
      canvas.addEventListener("pointermove", (e) => {
        if (e.buttons) pointerToHook(e);
      });

      let last = 0;
      function loop(ts) {
        const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
        last = ts;
        updateInput(dt);
        update(dt);
        drawScene();
        requestAnimationFrame(loop);
      }

      loadAssets().then(() => {
        resetFish();
        requestAnimationFrame(loop);
      });
    </script>
  </body>
</html>
