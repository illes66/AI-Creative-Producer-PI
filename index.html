<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mini Fishing Playable</title>
    <style>
      :root {
        --bg: #23ada6;
        --sea: #0ec4c7de;
        --sand: #f0d8a8;
        --ui: #132b3a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 20%, #d8f6ff 0, #b7edff 40%, #8fdaff 100%);
        font-family: system-ui, Arial, Helvetica;
      }
      .frame {
        width: min(92vw, 1260px);
        border: 6px solid #fff;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
        overflow: hidden;
        background: #1e7275;
      }
      canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        background: linear-gradient(var(--bg) 0 36%, var(--sea) 36% 88%, var(--sand) 88%);
        touch-action: none;
      }
      .legend {
        padding: 10px 14px;
        font-size: 14px;
        color: var(--ui);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <canvas id="game" width="960" height="540" aria-label="Juego de pesca"></canvas>
      <div class="legend">Move the hook ← → and ↑ ↓ (or mouse/touch). Catch the fish to know my skills.</div>
    </div>

    <script>
    
  // ============================================================
  // ASSETS
  // ============================================================
const ASSET_PATHS = {

  // Cada pez tiene dos imágenes:
  // normal = ojos abiertos
  // blink  = ojos cerrados

  fishes: [
    {
      normal: "fish1.png",
      blink: "fish1_blink.png"
    },
    {
      normal: "fish2.png",
      blink: "fish2_blink.png"
    }
  ],

  // Fish3 será un sprite sheet
  fish3Sheet: "fish3-sheet.png",
    fish4Sheet: "fish4-sheet.png"

};

  // ============================================================
  // GAME CONFIG
  // ============================================================

const GAME_CONFIG = {

  fishCount: 12,

  fishSpeedMin: 45,
  fishSpeedMax: 110,

  goal: 12,

  sparkleLife: 0.5,

  // Fish3
  fish3FrameCount: 18,
  fish3FPS: 8,
  fish3Rows: 4,
  fish3Columns: 4
};

  // ============================================================
  // CANVAS
  // ============================================================

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");


  // ============================================================
  // IMAGES
  // ============================================================

  const images = {
    rod: null,
    hook: null,
    plants: null,

    // Cada elemento tendrá:
    // {
    //   normal: Image,
    //   blink: Image
    // }
    fishes: []
  };


  // ============================================================
  // FALLBACK COLORS
  // ============================================================

  const fallbackFishColors = [
    "#ff7f6b",
    "#ffd36b",
    "#92f29f",
    "#d7a9ff"
  ];


  // ============================================================
  // IMAGE LOADER
  // ============================================================

  function loadImage(src) {
    return new Promise((resolve) => {

      const img = new Image();

      img.onload = () => {
        resolve({
          ok: true,
          img
        });
      };

      img.onerror = () => {
        console.warn("Could not load image:", src);

        resolve({
          ok: false,
          img: null
        });
      };

      img.src = src;
    });
  }


  // ============================================================
  // LOAD ASSETS
  // ============================================================

async function loadAssets() {

  // ==========================================
  // CARGAR FISH1 Y FISH2
  // Cada uno tiene normal + blink
  // ==========================================

  const fishPromises = ASSET_PATHS.fishes.flatMap((fish) => [
    loadImage(fish.normal),
    loadImage(fish.blink)
  ]);

  // ==========================================
  // CARGAR FISH3 SPRITE SHEET
  // ==========================================

  const fish3Promise = loadImage(
    ASSET_PATHS.fish3Sheet
  );
  // ==========================================
  // CARGAR FISH4 SPRITE SHEET
  // ==========================================

  const fish4Promise = loadImage(
    ASSET_PATHS.fish4Sheet
  );
 

  // ==========================================
  // GUARDAMOS FISH1 + FISH2
  // ==========================================

  images.fishes = [];

  for (let i = 0; i < ASSET_PATHS.fishes.length; i++) {

    const normalResult = results[i * 2];
    const blinkResult = results[i * 2 + 1];

    images.fishes.push({

      normal: normalResult.ok
        ? normalResult.img
        : null,

      blink: blinkResult.ok
        ? blinkResult.img
        : null
    });
  }


  // ==========================================
  // GUARDAMOS FISH3
  // ==========================================

  const fish3Result =
    results[results.length - 1];

  images.fish3Sheet =
    fish3Result.ok
      ? fish3Result.img
      : null;

  // ==========================================
  // GUARDAMOS FISH4
  // ==========================================

  const fish4Result =
    results[results.length - 1];

  images.fish4Sheet =
    fish4Result.ok
      ? fish4Result.img
      : null;
}


  // ============================================================
  // GAME STATE
  // ============================================================

  const state = {

    fish: [],

    sparkles: [],

    bubbles: [],

    hook: {
      x: 335,
      y: 315,
      radius: 18
    },

    score: 0,

    message: "Catch my skills!",

    messageTimer: 2.5
  };


  // ============================================================
  // RANDOM NUMBER
  // ============================================================

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }


  // ============================================================
  // CREATE FISH
  // ============================================================

function createFish() {

  const leftToRight = Math.random() > 0.5;

  const speed = rand(
    GAME_CONFIG.fishSpeedMin,
    GAME_CONFIG.fishSpeedMax
  );

  // 0 = fish1
  // 1 = fish2
  // 2 = fish3

  const fishType = Math.floor(Math.random() * 3);

  return {

    x: leftToRight
      ? rand(80, 260)
      : rand(700, 900),

    y: rand(220, 440),

    w: rand(100, 140),
    h: rand(50, 70),

    vx: leftToRight
      ? speed
      : -speed,

    // Tipo de pez
    fishType: fishType,

    // ======================================
    // BLINK
    // Cada pez tiene su propio temporizador
    // ======================================

    blinking: false,

    blinkTimer: rand(2, 5),

    // ======================================
    // SPRITE SHEET DE FISH3
    // ======================================

    spriteFrame: 0,

    spriteTimer: 0

  };
}


  // ============================================================
  // RESET / CREATE ALL FISH
  // ============================================================

  function resetFish() {

    state.fish = Array.from(
      {
        length: GAME_CONFIG.fishCount
      },
      createFish
    );
  }


  // ============================================================
  // CLAMP HOOK
  // ============================================================

  function clampHook() {

    state.hook.x = Math.max(
      80,
      Math.min(
        canvas.width - 60,
        state.hook.x
      )
    );

    state.hook.y = Math.max(
      110,
      Math.min(
        canvas.height - 40,
        state.hook.y
      )
    );
  }


  // ============================================================
  // SPARKLES
  // ============================================================

  function spawnSparkles(x, y) {

    for (let i = 0; i < 18; i++) {

      const a =
        (Math.PI * 2 * i) / 18;

      const speed = rand(30, 120);

      state.sparkles.push({

        x: x,

        y: y,

        vx: Math.cos(a) * speed,

        vy: Math.sin(a) * speed,

        life: GAME_CONFIG.sparkleLife
      });
    }
  }


  // ============================================================
  // BUBBLES
  // ============================================================

  function spawnBubble(f) {

    state.bubbles.push({

      // Slight random horizontal variation
      x: f.x + rand(-15, 15),

      // Start above the fish
      y: f.y - 20,

      // Bubble size
      radius: rand(2, 5),

      // Horizontal movement
      vx: rand(-8, 8),

      // Move upwards
      vy: rand(-25, -45),

      // Lifetime
      life: 1,

      maxLife: 1
    });
  }


  // ============================================================
  // UPDATE BUBBLES
  // ============================================================

  function updateBubbles(dt) {

    state.bubbles = state.bubbles.filter((b) => {

      b.life -= dt;

      b.x += b.vx * dt;

      b.y += b.vy * dt;

      // Slight horizontal damping
      b.vx *= 0.98;

      return b.life > 0;
    });
  }


  // ============================================================
  // UPDATE GAME
  // ============================================================

  function update(dt) {


    // ==========================================================
    // FISH
    // ==========================================================

    for (const f of state.fish) {


      // ==========================================
// BLINK — solo fish1 y fish2
// ==========================================

if (f.fishType === 0 || f.fishType === 1) {

  f.blinkTimer -= dt;

  if (f.blinkTimer <= 0) {

    f.blinking = !f.blinking;

    if (f.blinking) {

      // Ojos cerrados durante 0.12 segundos
      f.blinkTimer = 0.12;

    } else {

      // Siguiente parpadeo aleatorio
      f.blinkTimer = rand(2, 5);

    }
  }
}
      // ==========================================
// Animación del sprite sheet de Fish3
// ==========================================
// ==========================================
// SPRITE SHEET — FISH3
// ==========================================

if (f.fishType === 2 && images.fish3Sheet) {

  f.spriteTimer += dt;

  const frameDuration =
    1 / GAME_CONFIG.fish3FPS;

  if (f.spriteTimer >= frameDuration) {

    f.spriteTimer -= frameDuration;

    f.spriteFrame++;

    if (
      f.spriteFrame >=
      GAME_CONFIG.fish3FrameCount
    ) {
      f.spriteFrame = 0;
    }
  }
}
// SPRITE SHEET — FISH4
// ==========================================

if (f.fishType === 3 && images.fish4Sheet) {

  f.spriteTimer += dt;

  const frameDuration =
    1 / GAME_CONFIG.fish4FPS;

  if (f.spriteTimer >= frameDuration) {

    f.spriteTimer -= frameDuration;

    f.spriteFrame++;

    if (
      f.spriteFrame >=
      GAME_CONFIG.fish4FrameCount
    ) {
      f.spriteFrame = 0;
    }
  }
}

      // --------------------------------------------------------
      // Movement
      // --------------------------------------------------------

      f.x += f.vx * dt;


      if (
        f.x < 44 ||
        f.x > canvas.width - 44
      ) {

        f.vx *= -1;
      }


      // ========================================================
      // BLINK
      // ========================================================

      f.blinkTimer -= dt;


      if (f.blinkTimer <= 0) {

        f.blinking = !f.blinking;


        if (f.blinking) {

          // Eyes closed
          f.blinkTimer = 0.06;

        } else {

          // Time until next blink
          f.blinkTimer = rand(2, 5);
        }
      }


      // ========================================================
      // BUBBLES
      // ========================================================

      f.bubbleTimer -= dt;


      if (f.bubbleTimer <= 0) {

        spawnBubble(f);

        // Next bubble
        f.bubbleTimer = rand(2, 6);
      }


      // ========================================================
      // COLLISION WITH HOOK
      // ========================================================

      const dx =
        f.x - state.hook.x;

      const dy =
        f.y - state.hook.y;


      if (
        Math.hypot(dx, dy) <
        state.hook.radius +
        f.h * 0.45
      ) {


        // ------------------------------------------------------
        // SCORE
        // ------------------------------------------------------

        state.score += 1;


        state.message =
          "Skill catched! ✨";

        state.messageTimer = 1;


        // ------------------------------------------------------
        // CATCH EFFECT
        // ------------------------------------------------------

        spawnSparkles(
          f.x,
          f.y
        );


        // ------------------------------------------------------
        // REMOVE FISH
        // ------------------------------------------------------

        f.caught = true;


        // ------------------------------------------------------
        // GOAL
        // ------------------------------------------------------

        if (
          state.score >=
          GAME_CONFIG.goal
        ) {

          state.message =
            "¡You got your new member team!";

          state.messageTimer = 2;
        }
      }
    }


    // ==========================================================
    // REMOVE CAUGHT FISH
    // ==========================================================

    state.fish =
      state.fish.filter(
        (f) => !f.caught
      );


    // ==========================================================
    // UPDATE SPARKLES
    // ==========================================================

    state.sparkles =
      state.sparkles.filter((p) => {

        p.life -= dt;

        p.x += p.vx * dt;

        p.y += p.vy * dt;

        p.vx *= 0.96;

        p.vy *= 0.96;

        return p.life > 0;
      });


    // ==========================================================
    // UPDATE BUBBLES
    // ==========================================================

    updateBubbles(dt);


    // ==========================================================
    // MESSAGE TIMER
    // ==========================================================

    if (state.messageTimer > 0) {

      state.messageTimer -= dt;
    }
  }


  // ============================================================
  // DRAW FISH
  // ============================================================
function drawFish(f) {

  const facingRight = f.vx >= 0;

  const targetW = 100;
  const targetH = 100;

  ctx.save();

  ctx.translate(f.x, f.y);

  ctx.scale(
    facingRight ? 1 : -1,
    1
  );


  // ==========================================
  // FISH3 → SPRITE SHEET
  // ==========================================

  if (
    f.fishType === 2 &&
    images.fish3Sheet
  ) {

    const sheet = images.fish3Sheet;

    const frameWidth =
      sheet.width /
      GAME_CONFIG.fish3Columns;

    const frameHeight =
      sheet.height /
      GAME_CONFIG.fish3Rows;

    const column =
      f.spriteFrame %
      GAME_CONFIG.fish3Columns;

    const row =
      Math.floor(
        f.spriteFrame /
        GAME_CONFIG.fish3Columns
      );

    const sourceX =
      column * frameWidth;

    const sourceY =
      row * frameHeight;

    ctx.drawImage(

      sheet,

      // Parte del sprite sheet que queremos
      sourceX,
      sourceY,
      frameWidth,
      frameHeight,

      // Dónde lo dibujamos
      -targetW / 2,
      -targetH / 2,
      targetW,
      targetH
    );

  }

 // ==========================================
  // FISH4 → SPRITE SHEET
  // ==========================================

  if (
    f.fishType === 3 &&
    images.fish4Sheet
  ) {

    const sheet = images.fish4Sheet;

    const frameWidth =
      sheet.width /
      sheet.width /
      GAME_CONFIG.fish4Columns;
    const frameHeight =
      sheet.height /
      sheet.height /
      GAME_CONFIG.fish4Rows;
    const column =
      f.spriteFrame %
      f.spriteFrame %
      GAME_CONFIG.fish4Columns;
    const row =
      Math.floor(
        f.spriteFrame /
        GAME_CONFIG.fish4Columns
      );

    const sourceX =
      column * frameWidth;

    const sourceY =
      row * frameHeight;

    ctx.drawImage(

      sheet,

      // Parte del sprite sheet que queremos
      sourceX,
      sourceY,
      frameWidth,
      frameHeight,

      // Dónde lo dibujamos
      -targetW / 2,
      -targetH / 2,
      targetW,
      targetH
    );

  }
  // ==========================================
  // FISH1 + FISH2 → PNG NORMAL / BLINK
  // ==========================================

  else {

    const fish =
      images.fishes[f.fishType];

    if (!fish) {
      ctx.restore();
      return;
    }

    const sprite =
      f.blinking && fish.blink
        ? fish.blink
        : fish.normal;

    if (sprite) {

      ctx.drawImage(
        sprite,
        -targetW / 2,
        -targetH / 2,
        targetW,
        targetH
      );
    }
  }

  ctx.restore();
}


  // ============================================================
  // DRAW BUBBLES
  // ============================================================

  function drawBubbles() {

    for (const b of state.bubbles) {

      ctx.save();


      ctx.globalAlpha =
        Math.max(
          0,
          b.life / b.maxLife
        );


      ctx.strokeStyle =
        "#ffffff";


      ctx.lineWidth = 2;


      ctx.beginPath();


      ctx.arc(

        b.x,

        b.y,

        b.radius,

        0,

        Math.PI * 2
      );


      ctx.stroke();


      ctx.restore();
    }


    ctx.globalAlpha = 1;
  }


  // ============================================================
  // DRAW SCENE
  // ============================================================

  function drawScene() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    // ==========================================================
    // PLANTS
    // ==========================================================

    if (images.plants) {

      ctx.drawImage(

        images.plants,

        0,

        canvas.height - 180,

        canvas.width,

        180
      );

    } else {

      ctx.fillStyle =
        "rgba(8,112,68,.45)";


      for (
        let x = 20;
        x < canvas.width;
        x += 68
      ) {

        ctx.fillRect(

          x,

          canvas.height -
          92 -
          ((x / 19) % 22),

          8,

          86
        );
      }
    }


    // ==========================================================
    // FISH
    // ==========================================================

    state.fish.forEach(drawFish);


    // ==========================================================
    // BUBBLES
    // ==========================================================

    drawBubbles();


    // ==========================================================
    // ROD
    // ==========================================================

    if (images.rod) {

      ctx.drawImage(

        images.rod,

        170,

        275,

        190,

        125
      );

    } else {

      ctx.strokeStyle =
        "#8b5e34";

      ctx.lineWidth = 8;

      ctx.beginPath();

      ctx.moveTo(
        190,
        300
      );

      ctx.quadraticCurveTo(
        285,
        285,
        335,
        315
      );

      ctx.stroke();
    }


    // ==========================================================
    // LINE
    // ==========================================================

    ctx.strokeStyle =
      "#eaf5ff";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
      335,
      315
    );

    ctx.lineTo(
      state.hook.x,
      state.hook.y
    );

    ctx.stroke();


    // ==========================================================
    // HOOK
    // ==========================================================

    if (images.hook) {

      ctx.drawImage(

        images.hook,

        state.hook.x - 18,

        state.hook.y - 18,

        36,

        36
      );

    } else {

      ctx.strokeStyle =
        "#d6eef9";

      ctx.lineWidth = 3;

      ctx.beginPath();

      ctx.arc(

        state.hook.x,

        state.hook.y,

        14,

        -0.4,

        Math.PI * 1.3
      );

      ctx.stroke();
    }


    // ==========================================================
    // SPARKLES
    // ==========================================================

    for (
      const p of state.sparkles
    ) {

      ctx.globalAlpha =
        Math.max(
          0,
          p.life /
          GAME_CONFIG.sparkleLife
        );


      ctx.fillStyle =
       "#fff7a8";


      ctx.fillRect(

        p.x - 2,

        p.y - 2,

        4,

        4
      );
    }


    ctx.globalAlpha = 1;


    // ==========================================================
    // SCORE
    // ==========================================================

    //ctx.fillStyle =
    //  "#083450";

   ctx.font = "700 28px Arial, Helvetica";


    ctx.fillText(

      `Peces: ${state.score}/${GAME_CONFIG.goal}`,

      20,

      40
    );


    // ==========================================================
    // MESSAGE
    // ==========================================================

    if (
      state.messageTimer > 0
    ) {

      ctx.fillStyle =
        "#ffffff";

      ctx.strokeStyle =
        "rgba(0, 0, 0, .26)";

      ctx.lineWidth = 4;

    ctx.font = "800 42px Arial, Helvetica, sans-serif";


      const textW =
        ctx.measureText(
          state.message
        ).width;


      const textX =
        (
          canvas.width -
          textW
        ) * 0.5;


      const textY = 90;


      ctx.strokeText(

        state.message,

        textX,

        textY
      );


      ctx.fillText(

        state.message,

        textX,

        textY
      );
    }
  }


  // ============================================================
  // KEYBOARD INPUT
  // ============================================================

  const keyState =
    new Set();


  window.addEventListener(
    "keydown",
    (e) => {

      keyState.add(
        e.key
      );
    }
  );


  window.addEventListener(
    "keyup",
    (e) => {

      keyState.delete(
        e.key
      );
    }
  );


  // ============================================================
  // UPDATE INPUT
  // ============================================================

  function updateInput(dt) {

    const speed = 280;


    if (
      keyState.has("ArrowLeft") ||
      keyState.has("a") ||
      keyState.has("A")
    ) {

      state.hook.x -=
        speed * dt;
    }


    if (
      keyState.has("ArrowRight") ||
      keyState.has("d") ||
      keyState.has("D")
    ) {

      state.hook.x +=
        speed * dt;
    }


    if (
      keyState.has("ArrowUp") ||
      keyState.has("w") ||
      keyState.has("W")
    ) {

      state.hook.y -=
        speed * dt;
    }


    if (
      keyState.has("ArrowDown") ||
      keyState.has("s") ||
      keyState.has("S")
    ) {

      state.hook.y +=
        speed * dt;
    }


    clampHook();
  }


  // ============================================================
  // POINTER → HOOK
  // ============================================================

  function pointerToHook(evt) {

    const rect =
      canvas.getBoundingClientRect();


    const x =
      (
        (evt.clientX - rect.left) /
        rect.width
      ) *
      canvas.width;


    const y =
      (
        (evt.clientY - rect.top) /
        rect.height
      ) *
      canvas.height;


    state.hook.x = x;

    state.hook.y = y;


    clampHook();
  }


  canvas.addEventListener(
    "pointerdown",
    pointerToHook
  );


  canvas.addEventListener(
    "pointermove",
    (e) => {

      if (e.buttons) {

        pointerToHook(e);
      }
    }
  );


  // ============================================================
  // GAME LOOP
  // ============================================================

  let last = 0;


  function loop(ts) {

    const dt =
      Math.min(
        0.033,
        (ts - last) / 1000 ||
        0.016
      );


    last = ts;


    updateInput(dt);

    update(dt);

    drawScene();


    requestAnimationFrame(
      loop
    );
  }


  // ============================================================
  // START GAME
  // ============================================================

  loadAssets().then(() => {

    resetFish();

    requestAnimationFrame(
      loop
    );

  });

</script>
